name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # A project site is served from <user>.github.io/<repo>, so the app
          # needs that prefix. Derived from the repo name so renaming the repo
          # does not break asset paths. Set to '' if moving to a custom domain.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Verify export
        run: |
          test -f out/.nojekyll || touch out/.nojekyll
          test -f out/index.html
          test -f out/en/index.html
          test -f out/ar/index.html
          echo "Exported $(find out -name '*.html' | wc -l) pages"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
